<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Rob's Table logo</title>
  <desc id="logo-desc">A professional restaurant reservation logo with a plate and cutlery icon beside the Rob's Table wordmark.</desc>

  <defs>
    <linearGradient id="badge-gradient" x1="8" y1="8" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5784c7"/>
      <stop offset="1" stop-color="#1f3f67"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#102033" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="4" y="6" width="72" height="68" rx="18" fill="url(#badge-gradient)" filter="url(#soft-shadow)"/>
  <circle cx="40" cy="40" r="20" fill="#f7fbff" opacity="0.97"/>
  <circle cx="40" cy="40" r="12" fill="none" stroke="#d7e4f4" stroke-width="3"/>

  <path d="M23 25v30" fill="none" stroke="#f7fbff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M18 25v10M23 25v10M28 25v10" fill="none" stroke="#f7fbff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M57 25c-5 6-6 13-2 19v11" fill="none" stroke="#f7fbff" stroke-width="3.5" stroke-linecap="round"/>

  <text x="94" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="0.4">
    <tspan fill="#1a2a3a">Rob's</tspan>
    <tspan fill="#5784c7"> Table</tspan>
  </text>
</svg>
